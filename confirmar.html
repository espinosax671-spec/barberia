<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activando tu cuenta — CitaBarber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">

<div class="auth-container">

  <div class="auth-brand">
    <a href="index.html">
      <svg class="auth-brand-mark" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 8 L20 16 M4 16 L20 8" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      CITABARBER
    </a>
  </div>

  <div class="auth-card">

    <!-- Loading -->
    <div id="loadingView" class="check-email">
      <div class="spinner" style="margin: 0 auto 24px;"></div>
      <h2 style="font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; font-size: 1.2rem; color: var(--navy);">Activando tu cuenta...</h2>
      <p>Esto tomará solo un momento.</p>
    </div>

    <!-- Éxito -->
    <div id="successView" class="check-email" style="display:none;">
      <div class="check-email-icon" style="background: var(--success-soft); color: var(--success);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>¡Cuenta activada!</h2>
      <p>Tu barbería está lista.</p>
      <p><strong>30 días de prueba gratis</strong> activados.</p>
      <p class="mt-4">
        <a href="panel.html" class="btn btn-primary btn-lg">Ir a mi panel</a>
      </p>
    </div>

    <!-- Error -->
    <div id="errorView" class="check-email" style="display:none;">
      <div class="check-email-icon" style="background: var(--red-soft); color: var(--red);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </div>
      <h2>Ups, algo falló</h2>
      <p id="errorMsg">No pudimos activar tu cuenta.</p>
      <p class="mt-4">
        <a href="login.html" class="btn btn-ghost">Volver al login</a>
      </p>
    </div>

  </div>

</div>

<script src="config.js"></script>
<script src="confirmar.js"></script>
</body>
</html>
