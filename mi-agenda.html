<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi agenda — CitaBarber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mi-agenda.css">

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CitaBarber">
<link rel="apple-touch-icon" href="/iconos/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/iconos/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/iconos/icon-512.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="agenda-body">

<div id="loadingView" class="agenda-loading">
  <div class="spinner"></div>
  <p class="hint">Cargando tu agenda...</p>
</div>

<div id="agendaView" class="agenda-layout" style="display:none;">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">
        <div class="sidebar-logo-circle" id="sidebarLogoCircle">
          <img id="sidebarLogoImg" src="" alt="" style="display:none;">
          <span id="sidebarLogoInitial">B</span>
        </div>
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-name" id="sidebarNegocioNombre">Barberia</span>
          <span class="sidebar-brand-sub">Barberia</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-nav-item active" data-tab="citas" id="sidebarCitasBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          <span>Mis citas</span>
          <span class="sidebar-badge" id="sidebarCitasCount">0</span>
        </button>
        <button class="sidebar-nav-item" data-tab="perfil" id="sidebarPerfilBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Mi perfil</span>
        </button>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <div class="sidebar-info" id="sidebarInfo">
        <div class="sidebar-info-item" id="sidebarTelefono" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
          </svg>
          <span id="sidebarTelefonoText"></span>
        </div>
        <div class="sidebar-info-item" id="sidebarDireccion" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="sidebarDireccionText"></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- HEADER -->
    <header class="main-header">
      <div class="header-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-barbero">
          <div class="header-avatar" id="headerAvatar">
            <span id="avatarInitials">B</span>
            <img id="avatarImg" src="" alt="" style="display:none;">
          </div>
          <div class="header-barbero-info">
            <strong id="barberoNombre">Cargando...</strong>
            <span id="negocioNombreLabel">Mi agenda</span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <span id="userEmail" class="header-email"></span>
        <button id="logoutBtn" class="logout-btn">Cerrar sesion</button>
      </div>
    </header>

    <!-- TABS -->
    <nav class="main-tabs">
      <button class="main-tab active" data-tab="citas">
        Mis citas <span class="tab-count" id="citasCount">0</span>
      </button>
      <button class="main-tab" data-tab="perfil">Mi perfil</button>
    </nav>

    <!-- CONTENT -->
    <div class="main-body">

      <!-- TAB CITAS -->
      <section class="tab-panel" id="tab-citas">
        <div class="content-header">
          <h1>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
            Mi agenda
          </h1>
        </div>

        <div class="filter-bar" id="filterBar">
          <button class="filter-chip active" data-filter="hoy">Hoy <span class="count" id="c-hoy">0</span></button>
          <button class="filter-chip" data-filter="manana">Manana <span class="count" id="c-manana">0</span></button>
          <button class="filter-chip" data-filter="semana">Esta semana <span class="count" id="c-semana">0</span></button>
          <button class="filter-chip" data-filter="todas">Todas <span class="count" id="c-todas">0</span></button>
        </div>

        <div id="citasList" class="citas-list"></div>
      </section>

      <!-- TAB PERFIL -->
      <section class="tab-panel" id="tab-perfil" style="display:none;">
        <div class="content-header">
          <h1>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Mi perfil
          </h1>
        </div>

        <form id="perfilForm" class="perfil-form">
          <div class="field foto-upload-field">
            <label>Foto de perfil</label>
            <div class="foto-upload">
              <div class="foto-preview" id="fotoPreview">
                <span id="fotoPlaceholder" class="foto-initials">B</span>
                <img id="fotoImg" src="" alt="Foto" style="display:none;">
              </div>
              <div class="foto-actions">
                <input type="file" id="fotoInput" accept="image/*" style="display:none;">
                <button type="button" class="btn btn-blue btn-sm" id="uploadFotoBtn">Subir foto</button>
                <button type="button" class="btn btn-ghost btn-sm" id="removeFotoBtn" style="display:none;">Quitar</button>
              </div>
            </div>
            <span class="field-hint">Recomendado: 400x400px cuadrada. Formatos: JPG, PNG. Max 2MB</span>
          </div>

          <div class="field">
            <label for="perfilNombre">Nombre</label>
            <input type="text" id="perfilNombre" required>
          </div>
          <div class="field">
            <label for="perfilTelefono">Telefono</label>
            <input type="tel" id="perfilTelefono" placeholder="3000000000">
          </div>
          <div class="field">
            <label for="perfilEmail">Email</label>
            <input type="email" id="perfilEmail" required placeholder="tucorreo@ejemplo.com">
            <span class="field-hint">Si cambias tu email, recibiras un correo de confirmacion en la nueva direccion</span>
          </div>
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>

        <div class="password-section">
          <h2>Cambiar contrasena</h2>
          <form id="passwordForm" class="perfil-form">
            <div class="field">
              <label for="newPassword">Nueva contrasena</label>
              <input type="password" id="newPassword" minlength="6" required placeholder="Min. 6 caracteres">
            </div>
            <div class="field">
              <label for="newPassword2">Confirmar contrasena</label>
              <input type="password" id="newPassword2" minlength="6" required placeholder="Repite la contrasena">
            </div>
            <button type="submit" class="btn btn-dark">Actualizar contrasena</button>
          </form>
        </div>
      </section>

    </div>
  </div>

</div>

<!-- OVERLAY MOBILE -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div id="toastContainer"></div>

<script src="config.js"></script>
<script src="mi-agenda.js"></script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registrado:', reg.scope))
      .catch(err => console.error('SW error:', err));
  });
}
</script>

</body>
</html>
