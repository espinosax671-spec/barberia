<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — CitaBarber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a1f44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CitaBarber">
<link rel="apple-touch-icon" href="/iconos/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/iconos/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/iconos/icon-512.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

<div id="loadingView" class="admin-loading">
  <div class="spinner"></div>
  <p class="hint">Cargando panel de administracion...</p>
</div>

<div id="adminView" class="dashboard-wrapper" style="display:none;">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-box">
      <img src="citabarber.png" alt="CitaBarber" class="logo-img">
      <strong>Admin</strong>
    </div>

    <nav>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        Barberias
      </div>
    </nav>

    <div class="footer-box">
      <span class="status-dot"></span>
      Super admin
      <br>
      <span class="footer-sub">CitaBarber</span>
    </div>
  </aside>

  <!-- CONTENIDO -->
  <div class="main-content">

    <!-- HEADER -->
    <header class="topbar">
      <div>
        <h1>Panel de administracion</h1>
        <p id="userEmail"></p>
      </div>
      <button class="btn-logout" id="adminLogoutBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        Cerrar sesion
      </button>
    </header>

    <main class="admin-main">

      <div class="admin-container">

        <!-- STATS -->
        <div class="stats-grid">
        <div class="stat-card">
          <div class="icon-box blue">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
          </div>
          <div>
            <div class="number" id="statTotal">0</div>
            <div class="label">Barberias registradas</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="icon-box orange">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <div>
            <div class="number" id="statPendientes">0</div>
            <div class="label">Pendientes de aprobar</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="icon-box green">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div>
            <div class="number" id="statAprobadas">0</div>
            <div class="label">Aprobadas</div>
          </div>
        </div>
      </div>

      <!-- TABLA -->
      <div class="panel">
        <div class="panel-header">
          <span>Barberias</span>
          <button class="btn-refresh" id="refreshBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
            </svg>
            Actualizar
          </button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>URL</th>
                <th>Contacto</th>
                <th>Trial termina</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="negociosTable"></tbody>
          </table>
          <div class="empty-hint" id="emptyMsg" style="display:none;">Aun no hay barberias registradas.</div>
        </div>
      </div>

      </div>
    </main>
  </div>

</div>

<div id="toastContainer"></div>

<script src="config.js"></script>
<script src="admin.js"></script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registrado:', reg.scope))
      .catch(err => console.error('SW error:', err));
  });
}
</script>

</body>
</html>
