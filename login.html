<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — El Corte Clásico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

<div class="admin-login">
  <div class="admin-login-box login-wide">

    <div class="login-brand">
      <span class="brand-name">EL CORTE<br><strong>CLÁSICO</strong></span>
    </div>

    <!-- Tabs -->
    <div class="login-tabs">
      <button class="login-tab active" data-tab="ingresar">Iniciar sesión</button>
      <button class="login-tab" data-tab="registrar">Registrarme</button>
    </div>

    <!-- LOGIN -->
    <div class="login-panel" id="panel-ingresar">
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" required placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <p class="form-msg" id="loginMsg"></p>
      </form>
    </div>

    <!-- REGISTRO -->
    <div class="login-panel" id="panel-registrar" style="display:none;">
      <form id="registerForm">
        <p class="admin-sub">Crea tu cuenta y configura tu barbería en minutos.</p>

        <div class="field">
          <label for="regNombre">Nombre de tu barbería</label>
          <input type="text" id="regNombre" required placeholder="Ej: El Corte Clásico">
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="regEmail">Correo electrónico</label>
            <input type="email" id="regEmail" required placeholder="tucorreo@ejemplo.com">
          </div>
          <div class="field">
            <label for="regTelefono">WhatsApp</label>
            <input type="tel" id="regTelefono" placeholder="300 000 0000">
          </div>
        </div>

        <div class="field">
          <label for="regDireccion">Dirección</label>
          <input type="text" id="regDireccion" placeholder="Calle, número, ciudad">
        </div>

        <div class="field">
          <label for="regSubdominio">
            Nombre único para tu página
            <span class="field-hint">Solo letras minúsculas, números y guiones. Ej: corte-clasico</span>
          </label>
          <div class="subdominio-wrap">
            <input type="text" id="regSubdominio" required placeholder="mi-barberia"
              pattern="[a-z0-9\-]+" title="Solo minúsculas, números y guiones">
            <span class="subdominio-suffix">.tuapp.com</span>
          </div>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="regPassword">Contraseña</label>
            <input type="password" id="regPassword" required 
              placeholder="Mínimo 6 caracteres" minlength="6">
          </div>
          <div class="field">
            <label for="regPassword2">Confirmar contraseña</label>
            <input type="password" id="regPassword2" required 
              placeholder="Repite tu contraseña">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Crear mi cuenta
        </button>
        <p class="form-msg" id="registerMsg"></p>
      </form>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
