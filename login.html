<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — CitaBarber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">

<div class="auth-container">

  <div class="auth-brand">
    <a href="index.html">
      <svg class="auth-brand-mark" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 8 L20 16 M4 16 L20 8" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      CITABARBER
    </a>
  </div>

  <div class="auth-card">

    <div id="mainView">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="ingresar">Iniciar sesión</button>
        <button class="auth-tab" data-tab="registrar">Registrarme</button>
      </div>

      <!-- LOGIN -->
      <div class="auth-panel" id="panel-ingresar">
        <h1 class="auth-title">Bienvenido de vuelta</h1>
        <p class="auth-subtitle">Ingresa a tu panel para gestionar tus citas.</p>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Correo electrónico</label>
            <input type="email" id="loginEmail" required placeholder="tucorreo@ejemplo.com">
          </div>
          <div class="field">
            <label for="loginPassword">Contraseña</label>
            <div class="password-wrap">
              <input type="password" id="loginPassword" required placeholder="••••••••">
              <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Mostrar contraseña">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-dark btn-block btn-lg">Entrar</button>
          <p class="form-msg" id="loginMsg"></p>
        </form>
      </div>

      <!-- REGISTRO -->
      <div class="auth-panel" id="panel-registrar" style="display:none;">
        <h1 class="auth-title">Crea tu cuenta</h1>
        <p class="auth-subtitle">30 días de prueba gratis. Sin tarjeta de crédito.</p>

        <form id="registerForm">
          <div class="field">
            <label for="regNombre">Nombre de tu barbería</label>
            <input type="text" id="regNombre" required placeholder="Ej: El Corte Clásico">
          </div>

          <div class="field">
            <label for="regSubdominio">
              URL de tu barbería
              <span class="field-hint">Solo minúsculas, números y guiones</span>
            </label>
            <div class="subdominio-wrap">
              <input type="text" id="regSubdominio" required placeholder="mi-barberia"
                pattern="[a-z0-9\-]+" title="Solo minúsculas, números y guiones">
              <span class="subdominio-suffix" id="urlPreview">/reservar</span>
            </div>
          </div>

          <div class="form-row-2">
            <div class="field">
              <label for="regEmail">Correo</label>
              <input type="email" id="regEmail" required placeholder="tu@correo.com">
            </div>
            <div class="field">
              <label for="regTelefono">WhatsApp</label>
              <input type="tel" id="regTelefono" placeholder="3000000000">
            </div>
          </div>

          <div class="form-row-2">
            <div class="field">
              <label for="regPassword">Contraseña</label>
              <div class="password-wrap">
                <input type="password" id="regPassword" required minlength="6" placeholder="Mín. 6 caracteres">
                <button type="button" class="password-toggle" data-target="regPassword" aria-label="Mostrar contraseña">
                  <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="regPassword2">Confirmar</label>
              <div class="password-wrap">
                <input type="password" id="regPassword2" required placeholder="Repite tu contraseña">
                <button type="button" class="password-toggle" data-target="regPassword2" aria-label="Mostrar contraseña">
                  <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Crear mi cuenta</button>
          <p class="form-msg" id="registerMsg"></p>
        </form>
      </div>
    </div>

    <div id="checkEmailView" style="display:none;">
      <div class="check-email">
        <div class="check-email-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <h2>Revisa tu correo</h2>
        <p>Te enviamos un enlace de confirmación a:</p>
        <p><strong id="confirmEmailAddr"></strong></p>
        <p class="mt-2">Haz clic en el enlace para activar tu cuenta.</p>
        <p class="mt-4">
          <button type="button" class="btn btn-ghost" id="backToLoginBtn">Volver</button>
        </p>
      </div>
    </div>

  </div>

  <p class="auth-footer">
    ¿Necesitas ayuda? <a href="#">Contáctanos</a>
  </p>

</div>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
